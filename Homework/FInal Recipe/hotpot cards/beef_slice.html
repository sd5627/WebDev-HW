<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beef Slice</title>
<link rel="stylesheet" href="../styles.css">

<style>


.product-page{
  padding: 20px;
}


.product-gallery{
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}


.product-main,
.product-side{
  width: 300px;
  height: 300px;
}


.product-main img,
.product-side img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
}


.product-title{
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}


.product-sub{
  color: gray;
  margin-bottom: 15px;
}


.price-big{
  font-size: 28px;
  color: #e60023;
  font-weight: bold;
}

.add-cart-btn{
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  border-radius: 30px;
  border: none;
  background: #6495ed;
  color: white;
  font-size: 18px;
  cursor: pointer;
}


.summary{
  margin-top: 25px;
}

.summary p{
  color: #444;
  margin: 6px 0;
}

</style>
</head>

<body>

<header class="detail-header">
<a href="#" onclick="goBack()" class="back-btn">← Back</a>
</header>

<main class="product-page">


<div class="product-gallery">
  <div class="product-main">
    <img src="../hotpot/beef.jpg">
  </div>

  <div class="product-side">
    <img src="../hotpot/beef_2.jpg">
  </div>  
  
  <div class="product-side">
    <img src="../hotpot/beef_3.jpg">
  </div>
</div>


<div class="product-title">
Thin-sliced Beef Short Plate Rolls
</div>

<div class="product-sub">
肥牛片 · Best for hot pot, sukiyaki, noodle soup
</div>


<div class="price-big">
$12.99
</div>


<button class="add-cart-btn"
onclick="addToCart('Beef Slice','肥牛片','../images/beef.jpg',12.99)">
Add to Cart
</button>


<div class="summary">
  <h3>Product Summary</h3>
  <p>• Delicious flavor</p>
  <p>• Good quality beef</p>
  <p>• Perfect for hot pot</p>
</div>

</main>

<footer class="site-footer">
© 2026 Shihan's Kitchen
</footer>

<script>
function addToCart(name, cname, image, price){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let existing = cart.find(item => item.name === name);

  if(existing){
    existing.qty += 1;
  } else {
    cart.push({
      name,
      cname,
      image,
      price,
      qty: 1
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  alert("Added to cart 🛒");
}

function goBack(){
  const params = new URLSearchParams(window.location.search);
  const from = params.get("from");

  if(from === "cart"){
    window.location.href = "../shopping_cart.html";
  } else {
    window.location.href = "../hotpot.html";
  }
}
</script>

</body>
</html>
