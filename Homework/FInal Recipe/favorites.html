<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Favorites</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
<a href="profile.html" class="back-btn">← Back</a>
<h2 class="fav-title">Your Favorites</h2>

<div id="favList" class="favorites-grid"></div>

<script>
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

let list = document.getElementById("favList");

list.innerHTML = "";

favorites.forEach(item => {

  if(!item.name || !item.image || !item.link) return;

  let card = document.createElement("a");

  card.addEventListener("click", function(e) {
  e.preventDefault();
  window.location.replace(item.link + "?from=favorites");
});

  card.className = "recipe-item";

  card.innerHTML = `
    <img src="${item.image}" alt="${item.name}">
    <h3>${item.name}</h3>
    <p></p>
  `;

  list.appendChild(card);
});
</script>

</body>
</html>
