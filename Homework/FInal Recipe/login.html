<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-box">

    <h1>Log In</h1>

    <input id="loginUser" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="login()" class="main-btn">Log In</button>

    <div class="divider">or</div>

    <button class="social-btn google">
      <img src="images/google.png"> Continue with Google
    </button>

    <button class="social-btn apple">
      <img src="images/apple.png"> Continue with Apple
    </button>

    <p class="switch">
      Don’t have an account? <a href="signup.html">Sign up</a>
    </p>

  </div>

</div>

<script>
function login(){
  let username = document.getElementById("loginUser").value;
  let password = document.getElementById("loginPass").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];

  let found = users.find(u => u.username === username && u.password === password);

  if(found){
    localStorage.setItem("loggedInUser", username);
    window.location.href = "index.html";
  }else{
    alert("Wrong login");
  }
}
</script>

</body>
</html>
